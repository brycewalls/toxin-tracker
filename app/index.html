<title>Toxin Tracker</title>
<style>
/* Layout: phone-first single column app shell (max 480px), cards on a cool grey ground, fixed bottom tab bar.
   Visual language follows PepPedia: white rounded cards, light SF type, royal blue accent, green status pills, blue-gradient hero in dark. */
:root {
  --bg: #F2F3F7; --card: #FFFFFF; --card-2: #F6F7FA; --fg: #111318; --muted: #6B7080; --faint: #A3A8B6;
  --line: #E7E9EF; --accent: #2F55E4; --accent-ink: #FFFFFF; --accent-soft: #EAF0FF; --accent-line: #C9D6FB;
  --green: #1F9D55; --green-soft: #E5F6EC; --amber: #B7791F; --amber-soft: #FDF3E1; --red: #D93A3A; --red-soft: #FDECEC;
  --hero-1: #1E3FCB; --hero-2: #6E8BF5; --hero-fg: #FFFFFF;
  --shadow: 0 1px 2px rgba(17,19,24,.04), 0 6px 24px rgba(17,19,24,.05);
  --r: 20px; --r-sm: 12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Figtree", "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Figtree", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07080D; --card: #14161E; --card-2: #1B1E28; --fg: #F2F3F7; --muted: #9AA0B2; --faint: #636A7D;
  --line: #262A36; --accent: #6E8BFF; --accent-ink: #0A0C14; --accent-soft: #1A2550; --accent-line: #2C3D86;
  --green: #4ADE80; --green-soft: #12301F; --amber: #F6C25B; --amber-soft: #33270F; --red: #FF7676; --red-soft: #3A1717;
  --hero-1: #0B1A6E; --hero-2: #2F55E4; --hero-fg: #FFFFFF; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07080D; --card: #14161E; --card-2: #1B1E28; --fg: #F2F3F7; --muted: #9AA0B2; --faint: #636A7D;
  --line: #262A36; --accent: #6E8BFF; --accent-ink: #0A0C14; --accent-soft: #1A2550; --accent-line: #2C3D86;
  --green: #4ADE80; --green-soft: #12301F; --amber: #F6C25B; --amber-soft: #33270F; --red: #FF7676; --red-soft: #3A1717;
  --hero-1: #0B1A6E; --hero-2: #2F55E4; --hero-fg: #FFFFFF; --shadow: none; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }
#view { padding: 8px 16px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
#view > * { min-width: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
.tabbar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: grid; justify-items: center; gap: 3px; font-size: 10.5px; color: var(--faint); padding: 4px 0; min-height: 44px; }
.tab.on { color: var(--accent); }
.tab-log { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; justify-self: center;
  box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 45%, transparent); margin-top: -18px; }

/* type */
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.title-xl { font-size: 30px; font-weight: 500; letter-spacing: -.02em; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }
.big-num { font-family: var(--font-display); font-size: 34px; font-weight: 400; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.big-num small { font-size: 15px; color: var(--muted); margin-left: 3px; letter-spacing: 0; }

/* headers */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 2px 4px; }
.nav-h { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; padding: 8px 0 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.nav-h h1 { font-size: 20px; } .nav-r { display: flex; gap: 6px; justify-content: flex-end; min-width: 40px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); }
.icon-btn:hover { background: var(--card-2); }
.link-btn { color: var(--accent); font-weight: 500; padding: 8px 4px; min-height: 40px; }

/* cards */
.card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--line) 50%, transparent); min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h h3 { font-size: 16px; }
.callout { background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; }
.callout b { font-weight: 600; }

/* hero (PepPedia dark home) */
.hero { border-radius: 0 0 28px 28px; margin: -8px -16px 0; padding: 22px 20px 26px; color: var(--hero-fg);
  background: radial-gradient(120% 90% at 85% 0%, var(--hero-2) 0%, transparent 60%), linear-gradient(170deg, var(--hero-1), color-mix(in srgb, var(--hero-1) 60%, #000) ); }
.hero .muted { color: color-mix(in srgb, var(--hero-fg) 72%, transparent); }

/* pills, chips, seg */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: var(--card-2); color: var(--muted); }
.pill.green { background: var(--green-soft); color: var(--green); } .pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.amber { background: var(--amber-soft); color: var(--amber); } .pill.red { background: var(--red-soft); color: var(--red); }
.seg { display: inline-flex; background: var(--card-2); border-radius: 99px; padding: 3px; gap: 2px; border: 1px solid var(--line); }
.seg-b { padding: 6px 14px; border-radius: 99px; font-size: 13px; color: var(--muted); min-height: 32px; }
.seg-b.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 500; }
.seg.full { display: flex; } .seg.full .seg-b { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 14px; min-height: 40px; }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tabs-u { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
.tabs-u button { padding: 10px 0; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs-u button.on { color: var(--fg); border-color: var(--accent); }

/* lists */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow { min-width: 0; }
.li-title { font-weight: 500; } .li-sub { font-size: 12.5px; color: var(--muted); }
.check-ring { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green); flex: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* stat rings (PepPedia circular chips) */
.rings { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.ring { flex: none; display: grid; justify-items: center; gap: 6px; font-size: 11.5px; }
.ring-c { width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: baseline; justify-content: center; padding-top: 22px; gap: 1px; border: 1.5px solid color-mix(in srgb, var(--hero-fg) 35%, transparent); background: color-mix(in srgb, var(--hero-fg) 10%, transparent); font-size: 17px; font-variant-numeric: tabular-nums; }

/* forms */
.field { display: grid; gap: 6px; } .field > label { font-size: 13px; color: var(--muted); }
.input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; min-height: 46px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 84px; resize: vertical; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.stepper button { width: 38px; height: 38px; display: grid; place-items: center; color: var(--accent); font-size: 18px; }
.stepper input { width: 52px; text-align: center; border: 0; background: transparent; font-variant-numeric: tabular-nums; height: 38px; }
.step-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 13px; flex: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; font-weight: 500; background: var(--card-2); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; } .btn.danger { background: var(--red-soft); color: var(--red); border-color: transparent; }
.btn.sm { min-height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* utility */
.row { display: flex; align-items: center; } .gap { gap: 10px; } .gap-s { gap: 6px; } .between { justify-content: space-between; } .wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; } .stack { display: grid; gap: 12px; } .stack-s { display: grid; gap: 6px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }
.empty .ic { margin: 0 auto 10px; color: var(--faint); }
.sample-tag { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); background: var(--amber-soft); padding: 2px 6px; border-radius: 6px; }
.area { display: block; overflow: visible; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(5,7,15,.42); opacity: 0; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: 92%; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 26px 26px 0 0; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-wrap.in .sheet { transform: none; } .sheet-wrap.in .sheet-scrim { opacity: 1; }
.sheet-grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.sheet-h { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; padding: 4px 10px; }
.sheet-h h2 { font-size: 17px; text-align: center; }
.sheet-b { overflow-y: auto; padding: 8px 16px 24px; display: grid; gap: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; transition: .25s; z-index: 80;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; max-width: calc(100% - 32px); }
.toast.in { opacity: 1; transform: translate(-50%, 0); }
.disclaimer { font-size: 11.5px; color: var(--faint); text-align: center; padding: 4px 12px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <main id="view" aria-live="polite"><div class="empty">Loading your log…</div></main>
</div>
<nav class="tabbar" aria-label="Main">
  <div class="tabbar-in">
    <button class="tab on" data-tab="today"><span data-ic="home"></span>Today</button>
    <button class="tab" data-tab="history"><span data-ic="clock"></span>History</button>
    <button class="tab-log" data-tab="log" aria-label="Log injection"><span data-ic="plus"></span></button>
    <button class="tab" data-tab="stock"><span data-ic="vial"></span>Stock</button>
    <button class="tab" data-tab="face"><span data-ic="face"></span>Face Map</button>
  </div>
</nav>

<script src="core.js"></script>
<script src="facemap.js"></script>
<script src="today.js"></script>
<script src="log.js"></script>
<script src="history.js"></script>
<script src="stock.js"></script>
<script>
  document.querySelectorAll('[data-ic]').forEach((s) => (s.outerHTML = BT.icon(s.dataset.ic, s.dataset.ic === 'plus' ? 26 : 22)));
  document.querySelector('.tabbar').addEventListener('click', (e) => { const t = e.target.closest('[data-tab]'); if (t) BT.go(t.dataset.tab); });
  let rt; BT.on('change', () => { clearTimeout(rt); rt = setTimeout(() => { if (!document.querySelector('.sheet-wrap')) BT.render(); }, 30); });
  BT.render();
  BT.init().then(() => {
    // The artifact opens with marked sample data; the hosted app starts empty (Settings can load the sample).
    if (!window.BT_CLOUD && !BT.data.injections.length && !BT.data.settings.sampleCleared && !BT.data.settings.sampleLoaded) BT.loadSample();
    // Sample data v2 uses muscles and freeform points; refresh older sample records.
    else if (BT.hasSample() && BT.data.settings.sampleVersion !== 2) { BT.clearSample(); BT.save('settings', { sampleCleared: false }); BT.loadSample(); }
    if (BT.hasSample()) BT.save('settings', { sampleVersion: 2 });
    BT.render();
  });
  // Live timers tick without re-rendering whole screens: elements with data-until="<ms epoch>" show a countdown.
  setInterval(() => document.querySelectorAll('[data-until]').forEach((el) => { el.textContent = BT.fmt.countdown(+el.dataset.until - Date.now()); }), 1000);
</script>
